name: Verify Neural AI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_published_skill:
        description: Verify the Web skill installed from its published GitHub tag
        type: boolean
        default: false
      verify_published_mcp:
        description: Verify the currently published MCP archive, clean install and npx client
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm ci --prefix packages/mcp --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run verify:native
      - run: npm run verify:mcp
      - name: Download a current release receipt when it is not part of the baseline evidence
        if: github.event_name == 'workflow_dispatch' && inputs.verify_published_mcp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/mcp/package.json').version")
          if [ ! -f "evidence/mcp/release-$version.json" ]; then
            gh release download "mcp-v$version" --pattern '*.tgz' --pattern 'release-manifest.json' --dir dist/mcp
          fi
      - name: Verify the published MCP from npm
        if: github.event_name == 'workflow_dispatch' && inputs.verify_published_mcp
        run: npm run test:mcp:registry:current
      - run: npm run test:mcp:registry
      - name: Install the Web skill from the current checkout
        if: github.ref_type != 'tag'
        run: npm run test:clean-install -- --local
      - name: Install the Web skill from its published tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.verify_published_skill)
        run: npm run test:clean-install
      - run: npm run check:links
      - run: npm run check:sources
      - run: node scripts/package.mjs
      - run: npm run package:native
      - run: npm run package:charts-native
      - uses: actions/upload-artifact@v4
        with:
          name: neural-ui-mcp-verified
          path: dist/mcp/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: verified-skills
          path: |
            dist/neural-ui-*.tar.gz
            dist/SHA256SUMS
            dist/native-skill/
            dist/charts-native-skill/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: test-results/
          retention-days: 3

  publish-reviewed-releases:
    needs: verify
    if: github.repository == 'PedroMorenoTrujillo/neural-ai' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'PedroMorenoTrujillo' && github.triggering_actor == 'PedroMorenoTrujillo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v4
        with:
          name: verified-skills
          path: dist
      - run: node scripts/publish-reviewed-releases.mjs
